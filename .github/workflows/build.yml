name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-pi4:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ARM64 cross-compiler and FreeType
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            libfreetype6-dev \
            pkg-config \
            binutils-aarch64-linux-gnu

      - name: Install FreeType for AArch64
        run: |
          sudo dpkg --add-architecture arm64

          # 1. Restrict default Ubuntu 24.04 repos to amd64 only
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i 's/^Types: deb/Types: deb\nArchitectures: amd64/' /etc/apt/sources.list.d/ubuntu.sources
          fi
          
          # Catch any leftover legacy lists
          sudo sed -i 's/^deb /deb [arch=amd64] /g' /etc/apt/sources.list

          # 2. Add the proper Ubuntu Ports for arm64 (targeting Noble)
          cat <<EOF | sudo tee /etc/apt/sources.list.d/ubuntu-ports-arm64.sources
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports
          Suites: noble noble-updates noble-backports noble-security
          Components: main universe restricted multiverse
          Architectures: arm64
          EOF

          # 3. Update and install
          sudo apt-get update
          sudo apt-get install -y libfreetype6-dev:arm64

      - name: Build for Pi 4 (AArch64)
        run: |
          make clean
          make CC=aarch64-linux-gnu-gcc \
               ARCHFLAGS="-mcpu=cortex-a72" \
               PKG_CONFIG="pkg-config --define-prefix"
          aarch64-linux-gnu-strip pidash
          mv pidash pidash-pi4-aarch64

      - name: Upload release binary
        uses: softprops/action-gh-release@v2
        with:
          files: pidash-pi4-aarch64
          body: |
            ## pidash ${{ github.ref_name }}

            Raspberry Pi TFT dashboard for 160×128 RGB565 framebuffer.

            ### Quick install (Pi 4 / Pi 5)
            ```bash
            wget [https://github.com/circuito-suman/PiDash/releases/download/$](https://github.com/circuito-suman/PiDash/releases/download/$){{ github.ref_name }}/pidash-pi4-aarch64
            chmod +x pidash-pi4-aarch64
            sudo cp pidash-pi4-aarch64 /usr/local/bin/pidash
            sudo cp pidash.service /etc/systemd/system/
            sudo systemctl enable --now pidash
            ```

            ### Dependencies
            ```bash
            sudo apt install libfreetype6 docker.io tailscale
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}